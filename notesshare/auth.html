<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotesShare – log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F6FF;--ink:#1E1B3A;--muted:#6B6890;--line:#DAD7F2;--peri:#9AA5FF;--butter:#FFE76A;--pink:#FFA9CF;--red:#C2255C}
*{box-sizing:border-box;margin:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;width:100%}
.logo{display:inline-block;font-weight:800;font-size:1.35rem;letter-spacing:-.03em;text-decoration:none;padding:18px 0}
.logo i{display:inline-block;width:.7em;height:.7em;background:var(--peri);border:2px solid var(--ink);border-radius:50%;margin-right:6px}

main{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:24px 20px 60px}
.pitch h1{font-size:clamp(2.6rem,7vw,5.2rem);line-height:.95;letter-spacing:-.045em;font-weight:800;max-width:9ch}
.pitch p{color:var(--muted);font-size:1.15rem;max-width:34ch;margin-top:20px}

.panel{background:#fff;border:2px solid var(--ink);border-radius:28px;padding:28px;box-shadow:6px 6px 0 var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px;margin-bottom:22px}
.tabs button{border:0;background:none;border-radius:999px;padding:8px;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}

label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 4px}
.field{width:100%;border:2px solid var(--ink);border-radius:14px;padding:11px 14px;background:#fff}
.field[aria-invalid="true"]{border-color:var(--red)}
.pw{position:relative}
.pw .field{padding-right:72px}
.pw button{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);font-size:.9rem;text-decoration:underline}
.err{color:var(--red);font-size:.88rem;min-height:1.3em;margin-top:10px}
.hint{display:flex;justify-content:flex-end;margin-top:8px;font-size:.9rem}
.hint a{color:var(--muted)}

.btn{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:none;box-shadow:none}
.btn.primary{background:var(--butter);margin-top:14px}
.btn[disabled]{opacity:.6;pointer-events:none}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.9rem;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fine{color:var(--muted);font-size:.85rem;margin-top:16px;text-align:center}
[hidden]{display:none!important}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;transition:transform .25s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:820px){main{grid-template-columns:1fr;gap:28px}.pitch h1{max-width:none}}
</style>
</head>
<body>

<div class="wrap"><a class="logo" href="index.html"><i></i>NotesShare</a></div>

<main class="wrap">
  <section class="pitch">
    <h1 id="headline">welcome back.</h1>
    <p id="sub">Sign in to share notes and keep your account connected.</p>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist" aria-label="Log in or sign up">
      <button role="tab" id="tabLogin" aria-selected="true">Log in</button>
      <button role="tab" id="tabSignup" aria-selected="false">Sign up</button>
    </div>

    <button class="btn" type="button" id="google">Continue with Google</button>
    <div class="or">or use your email</div>

    <form id="form" novalidate>
      <div id="nameRow" hidden>
        <label for="name">Name</label>
        <input class="field" id="name" autocomplete="name" placeholder="What should we call you?">
      </div>

      <label for="email">Email</label>
      <input class="field" id="email" type="email" autocomplete="email" placeholder="you@college.edu">

      <label for="password">Password</label>
      <div class="pw">
        <input class="field" id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters">
        <button type="button" id="toggle" aria-label="Show password">Show</button>
      </div>

      <div class="hint" id="forgot"><a href="#" id="forgotLink">Forgot password?</a></div>

      <p class="err" id="err" role="alert"></p>
      <button class="btn primary" type="submit" id="submit">Log in</button>
    </form>

    <p class="fine" id="terms" hidden>By signing up you agree to share only notes you made yourself.</p>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { auth, firebaseErrorMessage } from './firebase.js';
import {
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  sendPasswordResetEmail,
  signInWithEmailAndPassword,
  signInWithPopup,
  updateProfile
} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';

const $ = s => document.querySelector(s);
let mode = 'login';

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}

function setMode(m){
  mode = m;
  const signup = m === 'signup';
  $('#tabLogin').setAttribute('aria-selected', !signup);
  $('#tabSignup').setAttribute('aria-selected', signup);
  $('#nameRow').hidden = !signup;
  $('#terms').hidden = !signup;
  $('#forgot').hidden = signup;
  $('#password').autocomplete = signup ? 'new-password' : 'current-password';
  $('#headline').textContent = signup ? 'join the notes club.' : 'welcome back.';
  $('#sub').textContent = signup ? 'Make an account to share notes with other students.' : 'Sign in to share notes and keep your account connected.';
  $('#submit').textContent = signup ? 'Create account' : 'Log in';
  $('#err').textContent = '';
  document.title = signup ? 'NotesShare – sign up' : 'NotesShare – log in';
}

function fail(id, msg){
  $('#err').textContent = msg;
  ['name','email','password'].forEach(f => $('#'+f).removeAttribute('aria-invalid'));
  $('#'+id).setAttribute('aria-invalid','true'); $('#'+id).focus();
}

function showAuthError(error) {
  console.error('Authentication request failed:', error);
  $('#err').textContent = firebaseErrorMessage(error);
}

function redirectAfterAuth(){
  const next = new URLSearchParams(location.search).get('next');
  const destination = next === 'share'
    ? 'index.html?share=1'
    : next === 'request'
      ? 'form.html'
      : 'index.html';
  location.replace(destination);
}

$('#tabLogin').onclick = () => setMode('login');
$('#tabSignup').onclick = () => setMode('signup');

$('#toggle').onclick = () => {
  const p = $('#password'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('#toggle').textContent = show ? 'Hide' : 'Show';
  $('#toggle').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
};

$('#forgotLink').onclick = e => {
  e.preventDefault();
  if (!/^\S+@\S+\.\S+$/.test($('#email').value)) return fail('email', 'Enter your email first, then tap Forgot password.');
  $('#err').textContent = '';
  sendPasswordResetEmail(auth, $('#email').value.trim())
    .then(() => toast('Password reset email sent. Check your inbox.'))
    .catch(showAuthError);
};

$('#google').onclick = async () => {
  $('#google').disabled = true;
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
    redirectAfterAuth();
  } catch (error) {
    showAuthError(error);
  } finally {
    $('#google').disabled = false;
  }
};

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#name').value.trim(), email = $('#email').value.trim(), pw = $('#password').value;
  if (mode === 'signup' && !name) return fail('name', 'Add your name so people know who shared the notes.');
  if (!/^\S+@\S+\.\S+$/.test(email)) return fail('email', 'Enter a valid email, like you@college.edu.');
  if (pw.length < 8) return fail('password', 'Use at least 8 characters for your password.');
  $('#err').textContent = '';

  const btn = $('#submit'); btn.disabled = true;
  try{
    if (mode === 'signup') {
      const credential = await createUserWithEmailAndPassword(auth, email, pw);
      await updateProfile(credential.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
    }
    toast(mode === 'signup' ? 'Account created.' : 'Logged in.');
    setTimeout(redirectAfterAuth, 300);
  } catch (error) {
    showAuthError(error);
  } finally {
    btn.disabled = false;
  }
});

if (location.hash === '#signup') setMode('signup');
</script>
</body>
</html>
